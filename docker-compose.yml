name: mandarin-study
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mandarin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mandarin}
      POSTGRES_DB: ${POSTGRES_DB:-mandarin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mandarin:mandarin@postgres:5432/mandarin}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AUDIO_DIR: /app/data/audio
      SEED_FULL_HSK: ${SEED_FULL_HSK:-true}
    volumes:
      - audio_data:/app/data/audio
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - target: 80
        published: '${WEB_PORT:-${APP_PORT:-8080}}'
        host_ip: '${WEB_BIND_HOST:-0.0.0.0}'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  audio_data:
